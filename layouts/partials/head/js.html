{{- if eq .Layout "archives" }}
  {{- with resources.Get "js/search.js" }}
    {{- $opts := dict "minify" (ne hugo.Environment "development") }}
    {{- $script := . | js.Build $opts }}
    {{- if ne hugo.Environment "development" }}
      {{- $script = $script | fingerprint }}
    {{- end }}
    <script src="{{ $script.RelPermalink }}" defer{{ with $script.Data.Integrity }} integrity="{{ . }}" crossorigin="anonymous"{{ end }}></script>
  {{- end }}
{{- end }}
